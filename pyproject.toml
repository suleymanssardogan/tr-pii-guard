[project]
name = "tr-pii-guard"
version = "0.4.0"
description = "Turkish PII detection and redaction for LLM pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.optional-dependencies]
ner = ["transformers>=4.30", "torch>=2.0"]
mcp = ["mcp>=2.0"]

[project.scripts]
tr-pii-guard = "tr_pii_guard.cli:main"
tr-pii-guard-mcp = "tr_pii_guard.mcp_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tr_pii_guard = ["py.typed"]
